# `docker compose up -d mongo`  → MongoDB only (run the app with `npm run dev`)
# `docker compose up --build`   → MongoDB + the Node application
services:
  mongo:
    image: mongo:7
    container_name: shikaku-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - shikaku-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: shikaku-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/shikaku
      CLIENT_URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  shikaku-mongo-data:
